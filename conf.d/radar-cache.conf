# Hermes — radar-tile + basemap-vtile cache node in front of the NWWS-OI origin
# (nginx 1.20.1, Oracle Linux 9). Terminates TLS with the ORIGIN's
# self-signed cert so the app's certificate pin still validates.
#
# Two cache zones with deliberately different eviction policies:
#   - radar: radar tile images (radar_dbz, radar_tiles PNG, times/meta)
#            evicted after 15 minutes without requests (freshness 240s)
#   - map:   basemap vector tiles (vtiles) — immutable per z/x/y, evicted
#            after 14 days without requests (freshness: origin max-age)
#
# Cache keys EXCLUDE fcm_token / device_secret (shared by all devices).
# vstyles are NOT cached: their JSON is rewritten per-device with that
# device's auth baked into the tile URLs, so sharing entries would leak
# tokens. Only GET paths are cached; POST/auth endpoints pass through.

# Access log format with per-request cache status (HIT/MISS/EXPIRED/
# UPDATING/STALE) for measuring cache effectiveness per zone.
log_format combined_cache '$remote_addr - $remote_user [$time_local] "$request" '
                          '$status $body_bytes_sent "$http_referer" '
                          '"$http_user_agent" "$http_x_forwarded_for" cache=$upstream_cache_status';

proxy_cache_path /var/cache/nginx/radar_cache
    levels=1:2
    keys_zone=radar:64m
    max_size=8g
    inactive=15m
    use_temp_path=off;

proxy_cache_path /var/cache/nginx/map_cache
    levels=1:2
    keys_zone=map:32m
    max_size=8g
    inactive=14d
    use_temp_path=off;

# Cache key: path + the content-affecting params only. The query string as-is
# would include fcm_token/device_secret and make every device's entry unique
# (zero sharing). $arg_* is safe: missing args simply become empty.
map $request_uri $radar_cache_key {
    default "";
}
# (the key is built in the server block below via $arg_* — map unused)

upstream nwws_origin {
    server 150.136.125.244:8443;
    keepalive 16;
}

server {
    listen 8443 ssl http2;
    server_name 129.80.186.193;

    ssl_certificate     /etc/nginx/ssl/hermes-cert.pem;
    ssl_certificate_key /etc/nginx/ssl/hermes-key.pem;

    access_log /var/log/nginx/radar_cache_access.log combined_cache;
    error_log  /var/log/nginx/radar_cache_error.log warn;

    # ── Health check (uncached, tiny) ─────────────────────────────────
    location = /api/v1/health {
        proxy_pass https://nwws_origin;
        proxy_ssl_verify off;           # origin cert is self-signed
        proxy_ssl_server_name off;
    }

    # ── nginx connection/request counters (stub_status) ───────────────
    # Localhost + Tailscale (CGNAT 100.64.0.0/10) only — not public.
    location = /nginx_status {
        stub_status;
        access_log off;
        allow 127.0.0.1;
        allow ::1;
        allow 100.64.0.0/10;
        deny all;
    }

    # ── Cached radar tile / times paths ───────────────────────────────
    location ~ ^/api/v1/(radar_dbz/[0-9]+/[0-9]+/[0-9]+|radar_dbz_times|radar_dbz_meta|radar_time|radar_tiles/[0-9]+/[0-9]+/[0-9]+\.png)$ {
        proxy_pass https://nwws_origin;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_ssl_verify off;
        proxy_ssl_server_name off;
        proxy_set_header Host $http_host;

        # Key on content-affecting params only — NOT fcm_token/device_secret.
        proxy_cache_key "$request_method|$uri|site=$arg_site|product=$arg_product|time=$arg_time|min_dbz=$arg_min_dbz|despeckle=$arg_despeckle|clutter=$arg_clutter";

        proxy_cache radar;
        proxy_cache_valid 200 240s;      # matches origin Cache-Control max-age
        proxy_cache_valid 404 10s;
        proxy_cache_use_stale updating error timeout http_500 http_502 http_503;
        proxy_cache_lock on;
        proxy_cache_lock_timeout 5s;

        # Don't cache auth failures.
        proxy_cache_bypass $http_cache_control;
        add_header X-Cache-Status $upstream_cache_status always;
    }

    # ── Cached basemap vector tiles (immutable per z/x/y) ─────────────
    location ~ ^/api/v1/vtiles/[0-9]+/[0-9]+/[0-9]+\.pbf$ {
        proxy_pass https://nwws_origin;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_ssl_verify off;
        proxy_ssl_server_name off;
        proxy_set_header Host $http_host;

        # Tiles are identical for every device — exclude auth params.
        proxy_cache_key "$request_method|$uri";

        proxy_cache map;
        proxy_cache_valid 200 7d;        # origin sends max-age (7d floor) anyway
        proxy_cache_valid 404 10s;
        proxy_cache_use_stale updating error timeout http_500 http_502 http_503;
        proxy_cache_lock on;
        proxy_cache_lock_timeout 5s;

        proxy_cache_bypass $http_cache_control;
        add_header X-Cache-Status $upstream_cache_status always;
    }

    # ── Everything else (POST/auth/vstyles/register/etc.) passes through ──
    location / {
        proxy_pass https://nwws_origin;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_ssl_verify off;
        proxy_ssl_server_name off;
        proxy_set_header Host $http_host;
    }
}
